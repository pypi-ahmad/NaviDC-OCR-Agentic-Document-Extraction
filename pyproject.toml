[project]
name = "navidc-agentic-document-extraction"
version = "0.1.0"
description = "Local agentic document extraction with NaviDC-OCR"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "markdown-it-py>=4.2.0",
    "numpy>=2.5.2",
    "openai>=3.6.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
    "streamlit[pdf]>=1.62.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_document_extraction"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.src]
include = ["src"]
exclude = ["src/agentic_document_extraction/worker.py"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "ty>=0.0.75",
]
